# Snitch — canonical issue labels / labels canoniques des issues.
# EN: Sync with `github-label-sync` or apply manually — keeping the list
#     in the repo makes triage conventions reviewable like code.
# FR: Sync via `github-label-sync` ou à la main — garder la liste dans
#     le dépôt rend les conventions de triage révisables comme du code.

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers — bounded scope, mentoring available"
- name: "help wanted"
  color: "008672"
  description: "Extra attention needed from the community"
- name: "bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement"
- name: "detection"
  color: "b60205"
  description: "Detection engine: rules, Sigma, heuristics"
- name: "firewall"
  color: "e99695"
  description: "Blocking, rules, NFQUEUE/eBPF/WFP/pf"
- name: "capture"
  color: "f9d0c4"
  description: "libpcap, parsers, protocol decoding"
- name: "siem"
  color: "c5def5"
  description: "Syslog, CEF, ECS, Wazuh/Splunk/Graylog integrations"
- name: "fleet"
  color: "bfd4f2"
  description: "Multi-agent: gossip, /remote/fleet, Helm, Ansible"
- name: "docs"
  color: "0075ca"
  description: "Documentation improvements and translations"
- name: "i18n"
  color: "0e8a16"
  description: "UI/localization work"
- name: "security"
  color: "b60205"
  description: "Vulnerability or hardening report — use advisories for real CVEs"
- name: "windows"
  color: "5319e7"
  description: "Windows-specific (Npcap, WFP, netsh)"
- name: "macos"
  color: "5319e7"
  description: "macOS-specific (NetworkExtension, pf)"
- name: "linux"
  color: "5319e7"
  description: "Linux-specific (NFQUEUE, eBPF, nftables)"
- name: "wontfix"
  color: "ffffff"
  description: "Not planned — reason explained in the thread"
