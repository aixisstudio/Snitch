      satellites — le même emblème que le splash et l'icône de l'app.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <ellipse cx="32" cy="32" rx="8" ry="22" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="14" cy="16" r="2.5" fill="#f7b016"/>
  <circle cx="50" cy="18" r="2.5" fill="#f7b016"/>
  <circle cx="52" cy="44" r="2.5" fill="#f7b016"/>
  <circle cx="12" cy="42" r="2.5" fill="#f7b016"/>
  <circle cx="32" cy="32" r="7" fill="#f7b016"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
