# Snitch agent — Rust CI / CI Rust de l'agent
# EN: Compile + unit-test the zero-dependency agent on all three desktop
#     targets on every push touching agent/. The binary MUST stay
#     dependency-free — if a crate is ever added, Cargo.lock appears and
#     this file should pin it.
# FR: Compile + teste l'agent zéro-dépendance sur les trois cibles
#     desktop à chaque push touchant agent/. Le binaire DOIT rester sans
#     dépendance — si une crate est ajoutée, Cargo.lock apparaît et ce
#     fichier devra l'épingler.

name: agent-ci

# EN: read-only checkout + artifact upload — nothing else is needed.
# FR: checkout lecture seule + upload d'artefacts — rien d'autre.
permissions:
  contents: read

on:
  push:
    paths: ["agent/**", ".github/workflows/ci-agent.yml"]
  pull_request:
    paths: ["agent/**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: snitch-agent-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: snitch-agent-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: snitch-agent-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Unit tests / tests unitaires
        working-directory: agent
        run: cargo test
      - name: Release build / build release
        working-directory: agent
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary / envoi du binaire
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: agent/target/${{ matrix.target }}/release/snitch-agent*
          if-no-files-found: ignore
