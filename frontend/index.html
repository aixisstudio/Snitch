<!DOCTYPE html>
<!--
  Snitch — HTML shell.

  EN: Single entry point for the Vite/React app. The #root div is where React
      mounts; everything else lives in src/.
  FR: Point d'entrée unique de l'app Vite/React. Le div #root est l'endroit où
      React se monte ; tout le reste vit dans src/.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="logo-180.png" />
    <title>Snitch — Know who's talking.</title>
    <style>
      /* EN: Global reset + dark base theme.
         FR: Reset global + thème sombre de base. */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #000000; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

      /* EN: Pill scrollbars to match the bento cards — fully rounded thumb
         floating on a transparent track, inset by a transparent border so
         it reads as a soft capsule, not a hard-edged bar.
         FR: Barres de défilement « pilule » assorties aux cartes bento —
         curseur entièrement arrondi flottant sur piste transparente, rentré
         par une bordure transparente pour un rendu capsule douce. */
      * { scrollbar-width: thin; scrollbar-color: #333333 transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #333333;
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
