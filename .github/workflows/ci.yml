# Snitch — continuous integration.
# EN: Python lint (ruff, critical rules only) + pytest on all three OSes,
#     frontend vitest + production build on every push/PR.
#     Release job (tags only): per-OS PyInstaller build + SHA256 checksums.
# FR: Lint Python (ruff, règles critiques) + pytest sur les trois OS, vitest
#     frontend + build de production à chaque push/PR.
#     Job release (tags seulement) : build PyInstaller par OS + checksums SHA256.

name: CI

# EN: Least-privilege token — jobs only need to read the repo, except the
#     docker job which pushes image packages to GHCR.
# FR: Jeton à moindre privilège — les jobs n'ont besoin que de lire le dépôt,
#     sauf le job docker qui pousse l'image sur GHCR.
permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff (syntax/critical rules)
        run: ruff check backend --select E9,F
      - name: Pytest
        run: cd backend && python -m pytest tests/ -v
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install + test + build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

  # EN: Per-OS PyInstaller build — runs on tags; verifies the spec compiles
  #     everywhere and produces checksums for the release.
  # FR: Build PyInstaller par OS — sur tags ; vérifie que le spec compile
  #     partout et produit les checksums pour la release.
  package:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Install backend deps + PyInstaller
        run: pip install -r backend/requirements.txt pyinstaller
      - name: PyInstaller build (onedir)
        run: cd backend && pyinstaller backend.spec --distpath ../dist/backend
      # EN: Stage the compiled UI inside the bundle so the standalone backend
      #     actually serves it — api/main.py mounts <bundle>/frontend_dist.
      #     Without this the backend tarball opens to a bare API.
      # FR: Mettre l'UI compilée dans le bundle pour que le backend autonome
      #     la serve — api/main.py monte <bundle>/frontend_dist. Sans ça le
      #     tarball backend n'ouvre qu'une API nue.
      - name: Stage frontend_dist into bundle
        shell: bash
        run: |
          mkdir -p dist/backend/snitch-backend/frontend_dist
          cp -r frontend/dist/. dist/backend/snitch-backend/frontend_dist/
      # EN: Backend tarball FIRST — it is the core artifact; an optional
      #     installer failure below must never cost us this upload.
      # FR: Tarball backend D'ABORD — c'est l'artefact cœur ; un échec
      #     d'installeur plus bas ne doit jamais empêcher cet upload.
      - name: SHA256 checksums
        shell: bash
        run: |
          cd dist/backend
          tar czf snitch-backend-${{ matrix.os }}.tar.gz snitch-backend
          sha256sum snitch-backend-${{ matrix.os }}.tar.gz > snitch-backend-${{ matrix.os }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: snitch-backend-${{ matrix.os }}
          path: dist/backend/*.tar.gz*
      # EN: One download per OS — the Electron app is the flagship artifact
      #     everywhere: Windows NSIS installer, macOS zip+dmg, Linux
      #     AppImage+deb. Unsigned builds: CSC_IDENTITY_AUTO_DISCOVERY=false
      #     skips signing when no certificate secret is configured.
      # FR: Un téléchargement par OS — l'app Electron est l'artefact principal
      #     partout : installeur NSIS Windows, zip+dmg macOS, AppImage+deb
      #     Linux. Builds non signés : CSC_IDENTITY_AUTO_DISCOVERY=false saute
      #     la signature quand aucun certificat n'est configuré.
      - name: Build Electron installer (Windows NSIS)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd electron
          npm ci
          npm run build
      - name: Build Electron app (macOS zip + dmg)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd electron
          npm ci
          npm run build:mac
      - name: Build Electron packages (Linux AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd electron
          npm ci
          npm run build:linux
      # EN: Lightweight backend-only installer — Inno Setup, opens the UI in
      #     the browser via --launcher. Npcap is NOT bundled (free license
      #     forbids redistribution); the .iss script detects it and points the
      #     user at the official download page. Fallback path if Electron
      #     breaks.
      # FR: Installeur léger backend seul — Inno Setup, ouvre l'UI dans le
      #     navigateur via --launcher. Npcap n'est PAS embarqué (la licence
      #     gratuite interdit la redistribution) ; le script .iss le détecte
      #     et renvoie vers la page officielle. Chemin de secours si Electron
      #     casse.
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ github.ref_name }}" -replace '^v',''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$v" "installer\snitch.iss"
      - name: Upload app installers
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snitch-app-${{ matrix.os }}
          path: dist/installer/*
      # EN: Code signing/notarization placeholders — disabled until you set the
      #     repository VARIABLE `ENABLE_CODESIGNING=true` and the secrets below.
      #     Windows: AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET +
      #              Trusted Signing endpoint, or a PFX in WINDOWS_CERT_PFX.
      #     macOS:   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD +
      #              MACOS_CERT_P12 (Developer ID) for codesign + notarytool.
      # FR: Placeholders de signature/notarisation — désactivés tant que la
      #     VARIABLE de dépôt `ENABLE_CODESIGNING=true` et les secrets
      #     ci-dessous ne sont pas configurés.
      #     Windows : AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET +
      #               endpoint Trusted Signing, ou un PFX dans WINDOWS_CERT_PFX.
      #     macOS   : APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD +
      #               MACOS_CERT_P12 (Developer ID) pour codesign + notarytool.
      - name: Code-sign backend (Windows placeholder)
        if: ${{ matrix.os == 'windows-latest' && vars.ENABLE_CODESIGNING == 'true' }}
        shell: pwsh
        run: |
          # EN: Example — Azure Trusted Signing / signtool. Replace with your
          #     certificate flow; keep secrets in GitHub Secrets, never inline.
          # FR: Exemple — Azure Trusted Signing / signtool. Remplacez par votre
          #     flux de certificat ; secrets dans GitHub Secrets, jamais en clair.
          Write-Host "signing would run here: signtool sign dist/backend/snitch-backend/snitch-backend.exe"
          exit 1  # EN: fail loudly if enabled but not implemented / FR: échouer si activé mais non implémenté
      - name: Code-sign + notarize backend (macOS placeholder)
        if: ${{ matrix.os == 'macos-latest' && vars.ENABLE_CODESIGNING == 'true' }}
        shell: bash
        run: |
          echo "signing would run here: codesign --sign 'Developer ID' dist/backend/snitch-backend"
          exit 1  # EN: fail loudly if enabled but not implemented / FR: échouer si activé mais non implémenté

  # EN: Publish the Docker image to GHCR — on tags and manual dispatch only,
  #     since Linux capture requires `docker run --network host` anyway.
  # FR: Publie l'image Docker sur GHCR — sur tags et déclenchement manuel
  #     seulement, la capture Linux exige `docker run --network host`.
  docker:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/snitch:latest
            ghcr.io/${{ github.repository_owner }}/snitch:${{ github.ref_name }}

  # EN: Tag release — gathers every build artifact (backend tarballs,
  #     checksums, Electron NSIS/zip/dmg/AppImage/deb, Inno Lite) and
  #     publishes them on the GitHub release for the tag. One file per OS,
  #     zero manual assembly.
  # FR: Release de tag — rassemble tous les artefacts (tarballs backend,
  #     checksums, Electron NSIS/zip/dmg/AppImage/deb, Inno Lite) et les
  #     publie sur la release GitHub du tag. Un fichier par OS, zéro
  #     assemblage manuel.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Publish GitHub release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*)
          echo "publishing ${#files[@]} files"
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --title "Snitch ${{ github.ref_name }}" --generate-notes \
            || gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
