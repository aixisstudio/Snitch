# Snitch — release packaging & submission automation
# EN: On a v* tag: build the nfpm packages, update the Homebrew tap
#     formula, and submit winget/choco manifests. Jobs whose secret is
#     absent SKIP cleanly (no red run) — set the secrets below to enable:
#       HOMEBREW_TAP_TOKEN — PAT with repo write on aixisstudio/homebrew-tap
#       WINGET_TOKEN       — PAT for microsoft/winget-pkgs submission
#       CHOCO_API_KEY      — chocolatey.org push key
# FR: Sur tag v* : paquets nfpm, formule Homebrew tap, manifests
#     winget/choco. Les jobs dont le secret manque SAUTENT proprement
#     (pas de run rouge) — créer les secrets ci-dessus pour activer.

name: release

on:
  push:
    tags: ["v*"]
  # EN: manual re-run against an existing tag — pick the tag as the ref
  #     so ${GITHUB_REF_NAME} resolves and jobs re-publish idempotently.
  # FR: relance manuelle sur un tag existant — choisir le tag comme ref
  #     pour que ${GITHUB_REF_NAME} se résolve et republie idempotemment.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nfpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage backend tree / Arbre staging
        run: |
          mkdir -p staging/opt/snitch
          cp -r backend staging/opt/snitch/
          rm -rf staging/opt/snitch/backend/env staging/opt/snitch/backend/tests
      - name: Install nfpm / Installer nfpm
        # EN: goreleaser/nfpm-action does not exist — install the pinned
        #     binary straight from the project's GitHub releases.
        # FR: goreleaser/nfpm-action n'existe pas — binaire épinglé pris
        #     directement dans les releases GitHub du projet.
        run: |
          NFPM_VER=2.48.0
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build .deb/.rpm
        run: |
          V=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: \"$V\"/" packaging/nfpm.yaml
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/snitch_${V}_amd64.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/snitch-${V}.x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  homebrew-tap:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when the secret is absent / Sauter si secret absent
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap update"
      - name: Render + push formula / Rendre + pousser la formule
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          V=${GITHUB_REF_NAME#v}
          SHA=$(curl -sL "https://github.com/aixisstudio/Snitch/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -e "s|@VERSION@|$V|" -e "s|@SHA256@|$SHA|" \
              packaging/homebrew/snitch.rb > snitch.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/aixisstudio/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp snitch.rb tap/Formula/snitch.rb
          cd tap && git add Formula/snitch.rb
          git -c user.name=snitch-bot -c user.email=bot@aixisstudio.github.io \
              commit -m "snitch $V" && git push

  winget:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when the secret is absent / Sauter si secret absent
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN not set — skipping manifest submission"
      - name: Detect installer assets / Détecter les installateurs
        # EN: winget-releaser needs a published GitHub Release holding a
        #     Snitch-Setup-*.exe asset; without Electron packaging that
        #     asset doesn't exist — skip loudly instead of failing red.
        # FR: winget-releaser exige une Release publiée avec un asset
        #     Snitch-Setup-*.exe ; sans packaging Electron l'asset
        #     n'existe pas — on saute proprement au lieu d'échouer.
        if: env.WINGET_TOKEN != ''
        id: assets
        shell: bash                     # EN: job runs on windows-latest → force bash / FR: job sur windows-latest → forcer bash
        run: |
          N=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" \
              | { grep -oE '"name"[ ]*:[ ]*"Snitch-Setup[^"]*"' || true; } | wc -l | tr -d ' ')
          echo "count=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" = "0" ]; then echo "::notice::no Snitch-Setup-*.exe release asset — skipping winget submission"; fi
      - name: Submit winget manifest / Soumettre le manifeste winget
        if: env.WINGET_TOKEN != '' && steps.assets.outputs.count != '0'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: aixisstudio.Snitch
          installers-regex: 'Snitch-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when the secret is absent / Sauter si secret absent
        if: env.CHOCO_API_KEY == ''
        run: echo "::notice::CHOCO_API_KEY not set — skipping choco push"
      - name: Pack + push choco / Pack + push choco
        if: env.CHOCO_API_KEY != ''
        run: |
          choco pack packaging/choco/snitch.nuspec --version ${env:GITHUB_REF_NAME.TrimStart('v')}
          choco push snitch.*.nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
