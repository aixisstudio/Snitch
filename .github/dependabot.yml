# Snitch — Dependabot configuration.
# EN: Weekly update PRs for Python deps, npm deps and GitHub Actions.
# FR: PRs de mise à jour hebdomadaires pour les deps Python, npm et les
#     GitHub Actions.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # EN: Rust agent — kept zero-dependency today, but if Cargo.lock ever
  #     gains entries dependabot watches them like everything else.
  # FR: Agent Rust — zéro dépendance aujourd'hui, mais si Cargo.lock
  #     gagne des entrées dependabot les surveille comme le reste.
  - package-ecosystem: "cargo"
    directory: "/agent"
    schedule:
      interval: "weekly"
