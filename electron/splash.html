<!DOCTYPE html>
<!--
  Snitch — splash screen.

  EN: Frameless startup screen shown while the backend boots. Pure SVG + CSS,
      ZERO external requests — works fully offline (system font fallbacks).
  FR: Écran de démarrage sans cadre affiché pendant le boot du backend.
      SVG + CSS uniquement, AUCUNE requête externe — fonctionne 100 % hors
      ligne (polices système de repli).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      border-radius: 14px;
      border: 1px solid #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .logo-wrap { width: 210px; }
    .logo-wrap svg { width: 100%; height: auto; display: block; }

    /* EN: fake progress bar — the window closes when the real backend is ready.
       FR: fausse barre de progression — la fenêtre se ferme quand le vrai backend est prêt. */
    .bar-wrap {
      width: 150px;
      height: 2px;
      background: #111;
      border-radius: 1px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: #f7b016;
      border-radius: 1px;
      animation: fill 4s ease-out forwards;
    }
    @keyframes fill {
      0%   { width: 0% }
      60%  { width: 75% }
      85%  { width: 88% }
      100% { width: 95% }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <!-- EN: Globe + connected nodes logo with the SNITCH wordmark.
         FR: Logo globe + nœuds connectés avec le mot-signature SNITCH. -->
    <!-- EN: Snitch sigil (white radar-eye) + wordmark.
         FR: Sigle Snitch (radar-œil blanc) + mot-signature. -->
    <img src="logo.png" alt="Snitch" style="width:170px;height:170px;display:block;margin:0 auto;" />
    <div style="text-align:center;margin-top:6px;">
      <div style="color:#f7b016;font-family:'Courier New',ui-monospace,monospace;font-size:9px;letter-spacing:8px;">REAL-TIME NETWORK</div>
      <div style="color:#ffffff;font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:44px;font-weight:800;letter-spacing:10px;margin-top:6px;">SNITCH</div>
      <div style="width:120px;height:1px;background:#f7b016;opacity:.5;margin:8px auto 0;"></div>
      <div style="color:rgba(255,255,255,.4);font-size:11px;letter-spacing:3px;font-weight:300;margin-top:8px;">Know who's talking.</div>
    </div>
  </div>
  <div class="bar-wrap"><div class="bar"></div></div>
</body>
</html>
